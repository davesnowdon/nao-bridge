[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nao-bridge-client"
version = "0.1.5"
description = "Python client library for NAO Bridge HTTP API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Dave Snowdon"},
]
keywords = [
    "nao",
    "robot",
    "aldebaran",
    "robotics",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pillow>=8.0.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
]

[project.urls]
Documentation = "https://github.com/davesnowdon/nao-bridge/tree/main/clients/python#readme"
Issues = "https://github.com/davesnowdon/nao-bridge/issues"
Source = "https://github.com/davesnowdon/nao-bridge"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0",
    "ruff>=0.12.5",
    "pyright>=1.1",
    "pre-commit>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nao_bridge_client"]

[tool.hatch.build.targets.sdist]
include = [
    "/nao_bridge_client",
    "/tests",
    "/README.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["nao_bridge_client", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["nao_bridge_client"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source_pkgs = ["nao_bridge_client"]
branch = true
parallel = true

[tool.coverage.paths]
nao_bridge_client = ["nao_bridge_client", "*/nao-bridge-client/nao_bridge_client"]
tests = ["tests", "*/nao-bridge-client/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
