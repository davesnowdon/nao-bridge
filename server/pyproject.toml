[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nao-bridge-server"
version = "0.2.0"
description = "HTTP/SSE API and supervised NAOqi agent for NAO Bridge"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "jsonschema>=4.23,<5"]

[project.scripts]
nao-bridge = "nao_bridge.main:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.12", "pyright>=1.1", "openapi-spec-validator>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["modern/nao_bridge"]

[tool.hatch.build.targets.sdist]
include = ["/modern", "/agent", "/pyproject.toml", "/uv.lock", "/requirements.lock"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["modern"]
venvPath = "."
venv = ".venv"
